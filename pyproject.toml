[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dbd-data"
dynamic = ["version"]
description = "TIPDI DBD data ingestion and collection platform"
requires-python = ">=3.11"
dependencies = [
  "curl_cffi>=0.7,<1",
  "cryptography>=43,<45",
  "truststore>=0.10,<1",
  "browser-cookie3>=0.19,<1",
  "PyMySQL>=1.1,<2",
  "pymssql>=2.3,<3",
  "python-dotenv>=1.1,<2",
  "aiolimiter>=1.2,<2",
  "tenacity>=9,<10",
  "asyncmy>=0.2.10,<1",
  "SQLAlchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "structlog>=25,<27",
  "prometheus-client>=0.22,<1",
  "sqlparse>=0.5,<1",
  "redis>=5,<7",
  "orjson>=3.10,<4",
  "zstandard>=0.23,<1",
  "boto3>=1.35,<2",
  "rich>=14,<15",
  "tzdata>=2025.2,<2028",
  "prompt_toolkit>=3.0,<4",
  "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "websockets>=17,<18"]
gateway = ["websockets>=17,<18"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires DBD_INTEGRATION=1 and DB_NAME=dbd_test_*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.dynamic]
version = {attr = "dbd._version.__version__"}

[tool.setuptools.data-files]
"share/dbd-data/sql" = ["sql/001_schema.sql", "sql/002_company_details.sql", "sql/003_financials.sql", "sql/004_enrichment.sql", "sql/005_bulk_ingestion.sql", "sql/006_discovery.sql", "sql/007_workers.sql", "sql/008_correctness_guards.sql", "sql/009_high_throughput_pipeline.sql", "sql/010_external_archive_backend.sql", "sql/011_project_attempt_budget.sql", "sql/012_campaign_runtime.sql"]

[project.scripts]
dbd-data = "dbd.cli.main:main"
dbd-deep = "dbd.deep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

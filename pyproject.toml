[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dbd-data"
version = "0.2.0"
description = "DBD DataWarehouse company data ingestion into MySQL"
requires-python = ">=3.11"
dependencies = [
  "curl_cffi>=0.7,<1",
  "cryptography>=43,<45",
  "truststore>=0.10,<1",
  "browser-cookie3>=0.19,<1",
  "PyMySQL>=1.1,<2",
  "python-dotenv>=1.1,<2",
  "aiolimiter>=1.2,<2",
  "tenacity>=9,<10",
  "asyncmy>=0.2.10,<1",
  "SQLAlchemy[asyncio]>=2.0,<2.1",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "structlog>=25,<27",
  "prometheus-client>=0.22,<1",
  "sqlparse>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires DBD_INTEGRATION=1 and DB_NAME=dbd_test_*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.data-files]
"share/dbd-data/sql" = ["sql/001_schema.sql", "sql/002_company_details.sql", "sql/003_financials.sql", "sql/004_enrichment.sql", "sql/005_bulk_ingestion.sql", "sql/006_discovery.sql", "sql/007_workers.sql", "sql/008_correctness_guards.sql"]

[project.scripts]
dbd-data = "dbd.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

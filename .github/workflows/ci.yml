name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: dbd_test_ci
      DBD_INTEGRATION: "1"
      DBD_METRICS_PORT: "0"
      DBD_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Redis fast-path benchmark
        run: >-
          python scripts/benchmark_redis_fast_path.py
          --redis-url "$DBD_REDIS_TEST_URL"
          --iterations 50
      - name: Terminal dashboard benchmark
        run: >-
          python scripts/benchmark_terminal_dashboard.py
          --iterations 2000
          --max-average-ms 2
          --max-p95-ms 5
